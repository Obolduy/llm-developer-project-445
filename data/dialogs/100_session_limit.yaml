# Лимит: две смены тарифа проходят, третья упирается в session_limit политики.
name: 100_session_limit
user: anna
turns:
  - say: переведи меня на семейный
    expect: { card: true }
  - say: да
    expect: { state: { tariff: Семейный } }
  - say: переведи меня на игровой
    expect: { card: true }
  - say: да
    expect: { state: { tariff: Игровой } }
  - say: переведи меня на базовый
    expect: { card: true }
  - say: да
    expect:
      reply_contains: ["лимит"]
      state: { tariff: Игровой }
